name: conformance

on:
  push:
  pull_request:

jobs:
  python-conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Parse machine-readable contracts
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          files = sorted(Path("schemas").rglob("*.json"))
          files += sorted(Path("conformance").rglob("*.json"))
          for path in files:
              json.loads(path.read_text(encoding="utf-8"))
              print(f"OK {path}")
          PY

      - name: Validate schemas and examples
        run: |
          python -m pip install --quiet "jsonschema==4.23.0"
          python schemas/validate_examples.py

      - name: FSRS-3 golden vectors
        run: python conformance/run_fsrs3_vectors.py

      - name: Business scenarios
        run: python conformance/business/run_business_scenarios.py
